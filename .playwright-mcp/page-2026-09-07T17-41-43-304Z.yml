      - paragraph [ref=e10]: IB Diploma Economics · SL and HL · First assessment 2022
      - heading "Find out which criterion is costing you the grade." [level=1] [ref=e11]
      - paragraph [ref=e12]: EconIB marks your IA commentaries and exam answers against each assessment criterion separately, then tells you which one is holding the rest down and what is missing from it. Not a score out of 45 with no explanation.
