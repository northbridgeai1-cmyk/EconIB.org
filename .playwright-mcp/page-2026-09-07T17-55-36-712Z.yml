      - paragraph [ref=f5e61]: There is no analytics, no advertising, no tracking pixel, no heatmap and no session recording. Nothing about your behaviour is sold or shared.
    - generic [ref=f5e62]:
      - heading "Cookies" [level=2] [ref=f5e63]
      - paragraph [ref=f5e64]:
        - text: EconIB sets
        - strong [ref=f5e65]: one
        - text: "cookie: a session token so you stay signed in. It is strictly necessary for the site to work, carries no tracking data, and needs no consent banner. There are no advertising or analytics cookies to consent to, which is why you are not being asked to dismiss a box."
    - generic [ref=f5e66]:
      - heading "Where your work goes when you ask for a mark" [level=2] [ref=f5e67]
      - paragraph [ref=f5e68]: Marking sends your commentary or answer to an AI provider. The provider in use is named on every result. Your work is not sent anywhere else, and is not sent at all unless you press the mark button.
      - generic [ref=f5e69]:
        - generic [ref=f5e70]: Free AI tiers may train on what you send
        - paragraph [ref=f5e71]: Some providers' free tiers allow submitted text to be used to improve their products, and read by human reviewers. Where that applies, EconIB warns you in red before you choose that provider. Your coursework is your call — but make it knowingly.
    - generic [ref=f5e72]:
      - heading "Deleting your account" [level=2] [ref=f5e73]
      - paragraph [ref=f5e74]: "Account settings has a delete button. It permanently removes your account, your commentaries, every marked answer, your progress and any stored API key. It happens immediately, it cannot be undone, and there is no backup to restore from. That is deliberate: a delete that leaves a copy behind is not a delete."
    - generic [ref=f5e75]:
      - heading "No warranty" [level=2] [ref=f5e76]
      - paragraph [ref=f5e77]: EconIB is provided as it is, with no guarantee that it is available, correct, or that its marks match an examiner's. It is a revision aid built by a student. Your results are your responsibility.
      - paragraph [ref=f5e78]: These terms may change. The date at the top says when they last did.
