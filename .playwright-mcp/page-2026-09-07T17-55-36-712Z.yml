    - generic [ref=f5e11]:
      - paragraph [ref=f5e12]: Last updated 7 September 2026
      - heading "Terms and privacy" [level=1] [ref=f5e13]
      - paragraph [ref=f5e14]: Short, specific, and about this site rather than about websites in general.
    - generic [ref=f5e15]:
      - heading "What EconIB is" [level=2] [ref=f5e16]
      - paragraph [ref=f5e17]:
        - text: A study tool for IB Diploma Economics, built and run independently. It is
        - strong [ref=f5e18]: not affiliated with, endorsed by, or connected to the International Baccalaureate Organization
        - text: . "IB" and "International Baccalaureate" are the IBO's trademarks and are used here only to describe the course this tool is for.
      - paragraph [ref=f5e19]: All syllabus guidance, rubric wording and study content on this site is written by EconIB. Mark allocations, band boundaries and assessment weightings are factual details of the assessment model. No copyrighted IB text is reproduced. Always check the official subject guide and your teacher's marking.
    - generic [ref=f5e20]:
      - heading "Marks here are not official" [level=2] [ref=f5e21]
      - paragraph [ref=f5e22]: EconIB gives you a considered second opinion. It is not a prediction and it is not moderation. Your IA is marked by your teacher and sampled by an IB moderator; your exams are marked by IB examiners.
      - paragraph [ref=f5e23]: The marker reads text only. It cannot see a diagram you have attached, so criterion A is judged on how your writing refers to and explains one. Where a free or open model produces a mark, the result says so and tells you how much weight to put on it.
      - generic [ref=f5e24]:
        - generic [ref=f5e25]: Do not submit work on the strength of a mark from here
        - paragraph [ref=f5e26]: A mark from EconIB tells you where the gaps are. It does not tell you what you will get. Grade boundaries move every session, which is why this site shows you a weighted percentage and never converts it into a grade.
    - generic [ref=f5e27]:
      - heading "Academic honesty" [level=2] [ref=f5e28]
      - paragraph [ref=f5e29]: "Your IA must be your own work. EconIB is built so that it cannot write it for you: there is no feature that drafts a sentence for you to paste in, and the marker is instructed never to supply replacement prose. It names what is missing and leaves the writing to you."
      - paragraph [ref=f5e30]: Using EconIB to find weaknesses in your own work is ordinary revision. Passing off text you did not write as your own is academic malpractice under the IB's rules, and the consequences fall on you, not on this site. If your school requires you to declare the tools you used, declare this one.
