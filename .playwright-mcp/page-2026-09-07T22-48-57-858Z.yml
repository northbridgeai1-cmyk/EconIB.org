          - paragraph [ref=f3e389]: Criterion B of the IA is terminology, and every Paper 1 part (a) opens by defining. These are the definitions worth knowing word for word.
          - generic [ref=f3e390]:
            - generic [ref=f3e391]:
              - generic [ref=f3e392]: Definition
              - term [ref=f3e393]: Market equilibrium
              - definition [ref=f3e394]: The price and quantity at which quantity demanded equals quantity supplied, so there is no tendency to change.
            - generic [ref=f3e395]:
              - generic [ref=f3e396]: Definition
              - term [ref=f3e397]: Excess demand
              - definition [ref=f3e398]: A shortage arising when price is below equilibrium and quantity demanded exceeds quantity supplied.
            - generic [ref=f3e399]:
              - generic [ref=f3e400]: Definition
              - term [ref=f3e401]: Excess supply
              - definition [ref=f3e402]: A surplus arising when price is above equilibrium and quantity supplied exceeds quantity demanded.
            - generic [ref=f3e403]:
              - generic [ref=f3e404]: Definition
              - term [ref=f3e405]: Consumer surplus
              - definition [ref=f3e406]: The difference between what consumers are willing to pay and what they actually pay.
            - generic [ref=f3e407]:
              - generic [ref=f3e408]: Definition
              - term [ref=f3e409]: Producer surplus
              - definition [ref=f3e410]: The difference between the price producers receive and the minimum they would accept.
            - generic [ref=f3e411]:
              - generic [ref=f3e412]: Definition
              - term [ref=f3e413]: Allocative efficiency
              - definition [ref=f3e414]: The outcome where resources produce the combination of goods most wanted by society, achieved where marginal benefit equals marginal cost.
