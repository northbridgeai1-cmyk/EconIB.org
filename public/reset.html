<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password — EconIB</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<div class="auth-page">
  <aside class="auth-side">
    <a class="brand" href="/">Econ<span>IB</span></a>
    <h2 class="auth-title">Choose a new password</h2>
    <p class="lede">
      Pick something you will actually remember. Length beats complexity — a short
      phrase is stronger and easier than a mangled word.
    </p>
    <p class="small">
      Signing in again on your other devices will be needed: changing your password
      signs them all out.
    </p>
  </aside>

  <main class="auth-main">
    <div class="auth-form">
      <div id="reset-root">
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-block"></div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="/assets/js/reset.js"></script>
</body>
</html>
