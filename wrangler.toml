name = "econib"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# D1 binding. Create the database once with:
#   wrangler d1 create econib
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "econib"
database_id = "6c5076d0-24fd-4868-b910-4284e72511ea"  # replaced by the real id on deploy

[vars]
# Origins allowed to call the API, comma separated. Each must be the exact
# scheme + host with NO trailing slash — the browser compares character for
# character. Both are listed because the pages.dev URL exists from the first
# deploy and the custom domain is added afterwards.
# There is deliberately no wildcard fallback: an unset value denies
# cross-origin reads rather than quietly allowing every origin.
ALLOWED_ORIGIN = "https://econib.org,https://econib.pages.dev"

# Google sign-in. Optional: without a client id the Google button does not
# appear at all, rather than appearing and failing.
# GOOGLE_CLIENT_ID = "....apps.googleusercontent.com"
#
# There is no PW_ITERATIONS setting any more: password stretching happens in
# the browser (600,000 PBKDF2 iterations, see public/assets/js/lib/pwcrypto.js)
# and the server only stores a fast hash of the result. That is what lets this
# run on the Workers FREE plan.

# Spend caps for AI grading, applied only to the SHARED key. A student using
# their own key spends their own quota and is not limited here.
#
# Set these to match your provider's real allowance. Free tiers cap TOKENS per
# day, not just requests: one IA marking is roughly 4,600 tokens, so Groq's
# 200,000 token daily allowance is about 43 markings for the whole deployment,
# not the 1,000 its request limit implies.
AI_DAILY_LIMIT_PER_USER = "5"
AI_DAILY_LIMIT_GLOBAL = "40"

# Which provider the shared key belongs to: groq | gemini | anthropic | openrouter
SHARED_AI_PROVIDER = "groq"
# Optional; each provider has a sensible default model if this is unset.
# SHARED_AI_MODEL = "openai/gpt-oss-120b"

# Secrets are NEVER set here. Set them with:
#   wrangler pages secret put SHARED_AI_KEY          <- the shared provider key
#   wrangler pages secret put KEY_ENCRYPTION_SECRET  <- 48+ random chars
#
# KEY_ENCRYPTION_SECRET encrypts students' own API keys at rest. Without it,
# students cannot save a key and the server says so rather than storing one in
# the clear. Generate one with:  openssl rand -base64 48
